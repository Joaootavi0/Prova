<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portal do Candidato ENEM</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Portal do Candidato ENEM</h1>
  </header>

  <main>
    <section aria-labelledby="login-title">
      <h2 id="login-title">Acesso ao sistema</h2>

      <form id="loginForm" novalidate>
        <label for="loginEmail">E-mail</label>
        <input type="email" id="loginEmail" name="loginEmail" placeholder="seuemail@exemplo.com" autocomplete="email" />
        <small id="loginEmailError" class="error"></small>

        <label for="loginSenha">Senha</label>
        <input type="password" id="loginSenha" name="loginSenha" placeholder="Digite sua senha" autocomplete="current-password" />
        <small id="loginSenhaError" class="error"></small>

        <button type="submit">Entrar</button>
      </form>

      <button type="button" id="btnCadastro">Cadastrar Novo Usuário</button>
    </section>
  </main>

  <footer>
    <p>© 2026 Portal do Candidato ENEM. Todos os direitos reservados GOV do Brasil</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
